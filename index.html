<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1015">
<meta name="description" content="Codex de campaña: personajes, lugares, objetos y cómo se conectan entre sí.">
<title>Codex de campaña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Spectral:wght@500;600;700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div id="app"></div>
<!-- Los diálogos van acá y no dentro de #app: #app tiene z-index propio, así
     que cualquier capa suya queda por debajo de la navegación, por alta que
     sea. Como hermano sí la tapa. -->
<div id="dialogs"></div>
<!-- El indicador de "tirá para actualizar" va afuera de #app porque #app se
     redibuja entero en cada render y se lo llevaría puesto a mitad del gesto. -->
<div id="ptr" aria-hidden="true"><span class="ptrc"></span></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<nav class="nav" style="display:none"><div class="navin" id="nav"></div></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
